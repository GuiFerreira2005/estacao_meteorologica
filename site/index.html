<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dash ESP32</title> <!--nome na aba da página -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header>
    <h1>Painel de Sensores</h1> <!--#Titulo da página abaixo da barra do navegador-->
    <span id="status" class="status">conectando…</span> <!--mensagem de "conectando" para "Ao vivo"-->
</header>
<main>
    <section id="avisos" class="avisos" aria-live="polite" hidden></section>

    <section id="cards" class="cards" aria-label="Leituras atuais"></section>

    <!-- Histórico: um único gráfico. O menu (select) escolhe qual sensor aparece -->
    <section class="painel">
        <div class="topo-historico">
            <h2>Histórico</h2>
            <label class="seletor-area">
                <span>Mostrar:</span>
                <select id="seletor"></select> <!-- as opções são criadas pelo main.js -->
            </label>
        </div>
        <div class="grafico"><canvas id="grafico"></canvas></div>
    </section>

    <section class="painel">
        <h2>Localização</h2>
        <div id="mapa"></div>
    </section>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="js/api.js"></script>
<script src="js/charts.js"></script>
<script src="js/map.js"></script>
<script src="js/alertas.js"></script>
<script src="js/main.js"></script>
</body>
</html>
